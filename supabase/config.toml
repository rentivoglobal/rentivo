project_id = "rentivo"

[api]
enabled = true
port = 54321
schemas = ["public", "private", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "https://rentivos.com.ng/**", "https://www.rentivos.com.ng/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[functions.imagekit-auth]
verify_jwt = true

[functions.request-access]
verify_jwt = true

[functions.paystack-initialize]
verify_jwt = true

[functions.paystack-webhook]
verify_jwt = false

[functions.paystack-refund]
verify_jwt = true

[functions.escalate-requests]
verify_jwt = true

[functions.resolve-bank-account]
verify_jwt = false

[functions.auth-signup]
verify_jwt = true

[functions.send-email]
verify_jwt = true

[functions.verify-lister-phone]
verify_jwt = true
