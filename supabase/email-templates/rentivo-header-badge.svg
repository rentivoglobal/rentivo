<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 96" width="260" height="96" fill="none">
  <defs>
    <linearGradient id="badgeBg" x1="0" y1="0" x2="260" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11164D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080B2B" stop-opacity="0.98"/>
    </linearGradient>

    <radialGradient id="lilacGlow" cx="75%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#BE89FF" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000052" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="winGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Container Pill -->
  <rect x="1" y="1" width="258" height="94" rx="16" fill="url(#badgeBg)" stroke="#BE89FF" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Ambient Light -->
  <circle cx="195" cy="46" r="45" fill="url(#lilacGlow)"/>

  <!-- Left: Mini Modern Architectural Elevation Concept -->
  <g transform="translate(16, 20)">
    <!-- First Floor -->
    <rect x="0" y="24" width="68" height="36" rx="3" fill="#161E58" stroke="#BE89FF" stroke-width="0.9" stroke-opacity="0.35"/>
    
    <!-- Cantilever Second Floor -->
    <rect x="8" y="6" width="66" height="22" rx="3" fill="#1E2975" stroke="#BE89FF" stroke-width="0.9" stroke-opacity="0.5"/>
    
    <!-- Pergola Roof Accent -->
    <line x1="4" y1="4" x2="78" y2="4" stroke="#BE89FF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.8"/>
    <line x1="16" y1="4" x2="16" y2="6" stroke="#BE89FF" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="34" y1="4" x2="34" y2="6" stroke="#BE89FF" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="52" y1="4" x2="52" y2="6" stroke="#BE89FF" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="68" y1="4" x2="68" y2="6" stroke="#BE89FF" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Warm Glowing Windows -->
    <rect x="16" y="10" width="20" height="12" rx="1.5" fill="url(#winGlow)"/>
    <rect x="42" y="10" width="24" height="12" rx="1.5" fill="url(#winGlow)"/>
    
    <!-- Lower Entry & Glass Panel -->
    <rect x="10" y="32" width="18" height="20" rx="1.5" fill="url(#winGlow)"/>
    <rect x="34" y="36" width="12" height="24" rx="1.5" fill="#BE89FF" fill-opacity="0.85"/>
    <circle cx="37" cy="48" r="1.2" fill="#000052"/>

    <!-- Small Tree Accent -->
    <circle cx="84" cy="44" r="8" fill="#BE89FF" fill-opacity="0.5"/>
    <line x1="84" y1="46" x2="84" y2="60" stroke="#BE89FF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>

  <!-- Center-Right: 3D Shield Crest -->
  <g transform="translate(132, 48)">
    <!-- Radiating Verification Halo -->
    <circle cx="0" cy="0" r="26" fill="#BE89FF" fill-opacity="0.14"/>
    <circle cx="0" cy="0" r="20" stroke="#BE89FF" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="3 2"/>

    <!-- 3D Shield -->
    <path d="M0 -18 L16 -9 C16 7 9 18 0 23 C-9 18 -16 7 -16 -9 Z" fill="url(#shieldGrad)"/>
    <path d="M0 -15 L13 -8 C13 5 7 15 0 19 C-7 15 -13 5 -13 -8 Z" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.45"/>

    <!-- Checkmark -->
    <path d="M-5.5 0 L-1.5 4.5 L7 -4" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Text Labels: 100% Verified & Direct Mandates -->
  <g transform="translate(162, 38)">
    <rect x="0" y="-12" width="86" height="20" rx="10" fill="#221C61" stroke="#BE89FF" stroke-width="1" stroke-opacity="0.6"/>
    <text x="43" y="2" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.06em">✓ VERIFIED</text>
    
    <text x="43" y="22" fill="#DDD6FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle" letter-spacing="0.02em">Direct Mandates</text>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF" opacity="0.8">
    <path d="M112 18 Q 113.5 21 115 22 Q 113.5 23 112 26 Q 110.5 23 109 22 Q 110.5 21 112 18 Z"/>
    <path d="M235 22 Q 236 24 237.5 25 Q 236 26 235 28 Q 234 26 232.5 25 Q 234 24 235 22 Z"/>
    <circle cx="124" cy="74" r="1.2" opacity="0.5"/>
    <circle cx="244" cy="68" r="1" opacity="0.5"/>
  </g>
</svg>
