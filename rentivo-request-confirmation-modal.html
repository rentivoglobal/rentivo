<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request sent - Rentivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS
========================================================= */
:root{
  color-scheme:light;
  --navy:#000052; --lavender:#be89ff; --violet:#6d35c9;
  --bg:#f6f5fb; --surface:#ffffff; --surface-2:#efedf7;
  --ink:#16163a; --ink-2:#55557a; --ink-3:#6b6b8d;
  --line:#e4e0f0; --line-strong:#c4bde0; --field-line:#8b86ad;
  --primary:#000052; --primary-hover:#20206e; --on-primary:#ffffff;
  --ok:#146c45; --ok-bg:#e3f4ec; --ok-solid:#17794e;
  --warn:#8a5200; --warn-bg:#fbeccf;
  --bad:#b32a47; --bad-bg:#fbe7ea; --bad-solid:#c8324e;
  --info:#5b28b0; --info-bg:#efe6ff;
  --font-head:'Outfit',system-ui,sans-serif;
  --font-body:'Plus Jakarta Sans',system-ui,sans-serif;
  --fs-xs:.75rem; --fs-sm:.8125rem; --fs-base:.9375rem; --fs-md:1.0625rem; --fs-lg:1.25rem;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  --r-sm:8px; --r-md:12px;
  --shadow-pop:0 16px 40px -12px rgba(10,10,40,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c0c1f; --surface:#15152f; --surface-2:#1d1d3d;
    --ink:#f1f0fb; --ink-2:#b3b1d4; --ink-3:#8d8bb0;
    --line:#2a2a4d; --line-strong:#38386a; --field-line:#6d6d9c;
    --violet:#c79bff; --primary:#be89ff; --primary-hover:#cba0ff; --on-primary:#000052;
    --ok:#5fd19a; --ok-bg:#0f3324; --ok-solid:#2aa06b;
    --warn:#e8b45c; --warn-bg:#3a2c14;
    --bad:#ff8aa0; --bad-bg:#3a1620; --bad-solid:#d13f5c;
    --info:#d3b0ff; --info-bg:#2c1f4d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0c1f; --surface:#15152f; --surface-2:#1d1d3d;
  --ink:#f1f0fb; --ink-2:#b3b1d4; --ink-3:#8d8bb0;
  --line:#2a2a4d; --line-strong:#38386a; --field-line:#6d6d9c;
  --violet:#c79bff; --primary:#be89ff; --primary-hover:#cba0ff; --on-primary:#000052;
  --ok:#5fd19a; --ok-bg:#0f3324; --ok-solid:#2aa06b;
  --warn:#e8b45c; --warn-bg:#3a2c14;
  --bad:#ff8aa0; --bad-bg:#3a1620; --bad-solid:#d13f5c;
  --info:#d3b0ff; --info-bg:#2c1f4d;
}

/* =========================================================
   BASE
========================================================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);font-size:var(--fs-base);line-height:1.5;background:var(--bg);color:var(--ink);min-height:100vh;}
img,svg{display:block;max-width:100%;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
a{color:inherit;text-decoration:none;}
h1,h2,h3{font-family:var(--font-head);line-height:1.2;letter-spacing:-.01em;color:var(--ink);}
:focus-visible{outline:2.5px solid var(--violet);outline-offset:2px;border-radius:4px;}

/* =========================================================
   TRIGGER PAGE  (minimal — just enough to open the modal from)
========================================================= */
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-5);padding:var(--s-5);text-align:center;}
.stage-brand{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:700;font-size:1.25rem;color:var(--ink);}
.stage-mark{width:36px;height:36px;border-radius:var(--r-sm);background:var(--navy);color:var(--lavender);display:grid;place-items:center;}
.stage-mark svg{width:20px;height:20px;}
.stage-brand em{font-style:normal;color:var(--violet);}
.stage p{color:var(--ink-2);max-width:38ch;}

/* =========================================================
   BUTTONS / PILLS  (shared)
========================================================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-sm);border:1.5px solid transparent;font-weight:600;font-size:var(--fs-base);white-space:nowrap;transition:background .12s;}
.btn svg{width:17px;height:17px;flex:none;}
.btn-primary{background:var(--primary);color:var(--on-primary);}
.btn-primary:hover{background:var(--primary-hover);}
.btn-accent{background:var(--lavender);color:var(--navy);}
.btn-accent:hover{background:#cba0ff;}
.link-btn{color:var(--violet);font-weight:600;font-size:var(--fs-sm);}
.link-btn:hover{text-decoration:underline;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:var(--fs-sm);font-weight:600;white-space:nowrap;}
.pill svg{width:13px;height:13px;flex:none;}
.pill-info{background:var(--info-bg);color:var(--info);}

/* =========================================================
   MODAL  (the deliverable)
========================================================= */
.dialog{position:relative;border:0;padding:0;margin:auto;width:calc(100% - 32px);max-width:600px;max-height:calc(100vh - 32px);background:var(--surface);color:var(--ink);border-radius:var(--r-md);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;overflow:hidden;}
.dialog::backdrop{background:rgba(10,10,30,.55);}
.dialog-body{padding:var(--s-6) var(--s-5) var(--s-5);overflow-y:auto;}
.modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;z-index:20;}
.modal-close:hover{background:var(--line);color:var(--ink);}
.modal-close svg{width:16px;height:16px;}

.success-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:6px 0 var(--s-5);}
.success-badge{width:60px;height:60px;border-radius:50%;background:var(--ok-bg);color:var(--ok-solid);display:grid;place-items:center;}
.success-badge svg{width:30px;height:30px;}
.success-hero h2{font-size:1.4rem;}
.success-ref{font-size:var(--fs-sm);color:var(--ink-3);font-variant-numeric:tabular-nums;}
.success-note{color:var(--ink-2);max-width:44ch;}

.prop-summary{display:flex;gap:var(--s-4);align-items:center;padding:var(--s-4);border:1px solid var(--line);border-radius:var(--r-md);}
.prop-thumb{flex:none;width:88px;height:66px;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);}
.prop-thumb img{width:100%;height:100%;object-fit:cover;}
.prop-text{flex:1;min-width:0;}
.kicker{font-size:var(--fs-xs);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px;}
.prop-meta{display:flex;flex-wrap:wrap;gap:0 var(--s-3);color:var(--ink-2);font-size:var(--fs-sm);margin-top:2px;}
.prop-meta .mi{display:inline-flex;align-items:center;gap:4px;}
.prop-meta svg{width:14px;height:14px;}
.prop-price{text-align:right;flex:none;}
.prop-price .amt{font-family:var(--font-head);font-weight:600;font-size:var(--fs-md);font-variant-numeric:tabular-nums;white-space:nowrap;}
.prop-price .per{font-size:var(--fs-sm);color:var(--ink-2);}
@media (max-width:479px){
  .prop-summary{flex-wrap:wrap;}
  .prop-text{flex:1 1 calc(100% - 104px);}
  .prop-price{flex:1 1 100%;text-align:left;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:6px;}
}

.modal-status{margin-top:var(--s-5);background:var(--surface-2);border-radius:var(--r-md);padding:var(--s-5);}
.modal-status h3{font-size:var(--fs-base);font-weight:700;margin-bottom:var(--s-4);}
.tl{position:relative;padding-left:30px;}
.tl-item{position:relative;padding-bottom:var(--s-4);}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:'';position:absolute;left:-24px;top:26px;bottom:-2px;width:2px;background:var(--line);}
.tl-item:last-child::before{display:none;}
.tl-dot{position:absolute;left:-30px;top:1px;width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;border:2px solid var(--line-strong);}
.tl-dot svg{width:11px;height:11px;color:var(--ink-3);}
.tl-item.done .tl-dot{background:var(--ok-solid);border-color:var(--ok-solid);}
.tl-item.done .tl-dot svg{color:#fff;}
.tl-item.now .tl-dot{background:var(--lavender);border-color:var(--lavender);}
.tl-item.now .tl-dot svg{color:var(--navy);}
.tl-item.todo{opacity:.55;}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(190,137,255,.55);}70%{box-shadow:0 0 0 9px rgba(190,137,255,0);}100%{box-shadow:0 0 0 0 rgba(190,137,255,0);}}
.tl-item.now .tl-dot{animation:pulseDot 2s ease-out infinite;}
.tl-title-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
.tl-title{font-weight:700;font-size:var(--fs-base);}
.tl-desc{font-size:var(--fs-sm);color:var(--ink-2);margin-top:2px;}

.free-note{display:flex;gap:var(--s-3);align-items:flex-start;padding:var(--s-4);border-radius:var(--r-md);background:var(--info-bg);margin-top:var(--s-5);}
.free-note svg{width:19px;height:19px;color:var(--violet);flex:none;margin-top:1px;}
.free-note p{font-size:var(--fs-sm);color:var(--ink);}
.free-note strong{color:var(--violet);}

.cta-col{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:var(--s-6);}
.cta-col .btn{width:100%;max-width:360px;}

@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important;} }

</style>
</head>
<body>
<div class="stage">
  <div class="stage-brand"><span class="stage-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg></span><span>RENT<em>ivo</em></span></div>
  <p>This is the confirmation that appears right after a renter sends a request. Close it to see the page behind it.</p>
  <button type="button" class="btn btn-accent" data-action="openModal">Show request confirmation</button>
</div>
<script>
'use strict';
/* ============================================================
   ICONS
============================================================ */
const ICON = {
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`,
  checkBig:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`,
  clock:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`,
  lock:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`,
  x:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`,
  loc:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>`,
  sparkle:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/><circle cx="12" cy="12" r="3"/></svg>`,
  inbox:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>`,
  home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>`,
};
function icon(name){ return ICON[name] || ''; }
const $ = (sel, root=document) => root.querySelector(sel);

/* ============================================================
   DEMO DATA  (the single request this modal is confirming)
============================================================ */
const houseArt = (() => {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
    <rect width="640" height="480" fill="#e7defb"/><circle cx="540" cy="90" r="36" fill="#f2c46b"/>
    <rect y="370" width="640" height="110" fill="#d3c8ee"/>
    <rect x="150" y="215" width="340" height="165" fill="#f5efe6"/><polygon points="126,220 320,118 514,220" fill="#3b2a7a"/>
    <rect x="290" y="285" width="62" height="95" fill="#000052"/><rect x="186" y="255" width="66" height="58" fill="#9fb8e8"/><rect x="388" y="255" width="66" height="58" fill="#9fb8e8"/>
    <rect x="60" y="340" width="6" height="40" fill="#3b2a7a"/><circle cx="63" cy="318" r="34" fill="#be89ff" opacity=".55"/>
  </svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
})();

const request = {
  ref:'RQ-20604', since:'Just now',
  listing:{title:'2-Bedroom Self-Contain', area:'Bodija', rooms:'2 bedrooms', price:850000, photo:houseArt},
};
function naira(n){ return '₦' + Number(n || 0).toLocaleString('en-NG'); }

/* ============================================================
   MODAL CONTENT
============================================================ */
function statusStep(cls, icName, title, desc, extra){
  return `<div class="tl-item ${cls}"><span class="tl-dot">${icon(icName)}</span>
    <div class="tl-title-row"><span class="tl-title">${title}</span>${extra || ''}</div>
    <div class="tl-desc">${desc}</div></div>`;
}

function modalHTML(r){
  const l = r.listing;
  return `
    <div class="success-hero">
      <div class="success-badge">${icon('checkBig')}</div>
      <h2 tabindex="-1">Request sent</h2>
      <p class="success-note">We've let the lister know you're interested in this property. Nothing has been charged — this request is free.</p>
      <p class="success-ref">Reference ${r.ref}</p>
    </div>

    <div class="prop-summary">
      <span class="prop-thumb"><img src="${l.photo}" alt=""></span>
      <div class="prop-text">
        <p class="kicker">You requested</p>
        <strong style="font-family:var(--font-head);font-size:var(--fs-md)">${l.title}</strong>
        <div class="prop-meta"><span class="mi">${icon('loc')}${l.area}</span><span>${l.rooms}</span></div>
      </div>
      <div class="prop-price"><div class="amt">${naira(l.price)}</div><div class="per">per year</div></div>
    </div>

    <div class="modal-status">
      <h3>What happens next</h3>
      <div class="tl">
        ${statusStep('done', 'check', 'Request sent', `Submitted ${r.since.toLowerCase()}`)}
        ${statusStep('now', 'clock', 'Confirming with the lister', "We're checking this property is still available. We'll notify you as soon as they reply — no need to keep this page open.")}
        ${statusStep('todo', 'lock', 'Pay the access fee', `A flat ${naira(5000)}, only if the lister confirms. Nothing is charged until then.`, `<span class="pill pill-info">First 100 renters free</span>`)}
        ${statusStep('todo', 'lock', 'Get their contact details', 'Shared with you right after payment, so you can arrange a viewing.')}
      </div>
    </div>

    <div class="free-note">${icon('sparkle')}<p><strong>This step is free.</strong> If the property turns out to be unavailable, we'll tell you at no charge — you won't be asked to pay for a property that's already gone.</p></div>

    <div class="cta-col">
      <button type="button" class="btn btn-primary" data-action="closeModal">${icon('inbox')} View all my requests</button>
      <button type="button" class="link-btn" data-action="closeModal">Continue browsing</button>
    </div>`;
}

/* ============================================================
   OPEN / CLOSE
============================================================ */
function openModal(){
  let d = $('#dlg');
  if(!d){
    d = document.createElement('dialog'); d.id = 'dlg'; d.className = 'dialog';
    d.addEventListener('click', e => { if(e.target === d) closeModal(); });
    document.body.appendChild(d);
  }
  d.innerHTML = `
    <button type="button" class="modal-close" data-action="closeModal" aria-label="Close">${icon('x')}</button>
    <div class="dialog-body">${modalHTML(request)}</div>
  `;
  if(!d.open) d.showModal();
  requestAnimationFrame(() => { const h = $('#dlg h2'); if(h) h.focus({preventScroll:true}); });
}
function closeModal(){ const d = $('#dlg'); if(d && d.open) d.close(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(el && el.dataset.action === 'openModal') openModal();
  if(el && el.dataset.action === 'closeModal') closeModal();
});

/* Opens automatically — this file's whole purpose is the moment
   right after a request is sent — and can be reopened afterwards
   from the stage behind it. */
openModal();

</script>
</body>
</html>
